<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/hostelcare-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Content Security Policy (CSP) - XSS Protection -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        upgrade-insecure-requests;
      "
    />

    <!-- Additional Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />

    <title>HostelCare - Hostel Maintenance Made Easy</title>
    <meta
      name="description"
      content="Digital hostel maintenance reporting with 24/7 complaint submission, real-time tracking, and transparent resolution process."
    />
    <meta name="author" content="HostelCare" />

    <meta
      property="og:title"
      content="HostelCare - Hostel Maintenance Made Easy"
    />
    <meta
      property="og:description"
      content="Digital hostel maintenance reporting with 24/7 complaint submission, real-time tracking, and transparent resolution process."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
